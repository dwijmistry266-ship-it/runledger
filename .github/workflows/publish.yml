# Publish RunLedger to PyPI with Trusted Publishing (no stored tokens).
#
# One-time setup (maintainer, on pypi.org): add a *pending* trusted publisher
# for PyPI project name `runledger` pointing at this repository with workflow
# name `publish.yml` and no environment restriction. The project is created
# automatically on the first successful publish. PyPI mints a short-lived
# token for each run via OIDC; no API token is stored anywhere.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
