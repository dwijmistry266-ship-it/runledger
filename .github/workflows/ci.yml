name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
        env:
          PYTHONPATH: src
      - name: Report test failure (Windows debug)
        if: failure() && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debug
          tail -c 40000 test-output.txt > "debug/windows-${{ matrix.python-version }}.txt"
          git config user.email "ci@example.com"
          git config user.name "CI debug"
          git checkout -B debug/windows-ci
          git add debug/
          git commit -m "debug: windows failure output" || true
          git push --force origin debug/windows-ci
