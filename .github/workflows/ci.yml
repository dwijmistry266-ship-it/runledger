name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
        env:
          PYTHONPATH: src
      - name: Report test failure (Windows debug)
        if: failure() && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 50000 test-output.txt > failure-tail.txt
          gh issue comment 1 --body-file failure-tail.txt --repo dwijmistry266-ship-it/runledger || true
